name: Alfanomy
options:
  bundleIdPrefix: ru.alfanomy
  deploymentTarget:
    iOS: "15.0"
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Alfanomy:
    type: application
    platform: iOS
    sources:
      - path: Alfanomy
    resources:
      - path: Alfanomy/Assets.xcassets
      - path: Alfanomy/GoogleService-Info.plist
    dependencies:
      - package: FirebaseSDK
        product: FirebaseMessaging
    # Веб-приложение (Resources/, 273 файла: index.html, code.js, картинки,
    # вложенные папки) копируется отдельным shell-скриптом, а не через
    # декларативный "resources: - path: Resources, type: folder" -
    # последнее в установленной версии XcodeGen (2.46.0) тихо отбрасывало
    # всю запись целиком без единой ошибки (подтверждено печатью
    # сгенерированного project.pbxproj и прямым осмотром собранного .app в
    # CI - несмотря на type: folder, Resources ни разу не появилась в
    # бандле, хотя соседние resources-записи без type: folder работали).
    # cp -R гарантированно сохраняет структуру Resources/... внутри
    # бандла, которую ищет WebViewController.swift.
    postBuildScripts:
      - name: Copy web app Resources
        script: |
          set -e
          DEST="$CODESIGNING_FOLDER_PATH/Resources"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRCROOT/Resources/." "$DEST/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.alfanomy.mapp
        INFOPLIST_FILE: Alfanomy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      # Ручная подпись только для Release-конфигурации самого таргета Alfanomy.
      # Если задать это через xcodebuild -X на командной строке, оно применяется
      # ко ВСЕМ таргетам сборки разом, включая библиотеки Firebase/Google (SPM) -
      # а библиотеки в принципе не поддерживают provisioning profile, из-за чего
      # archive падал с "does not support provisioning profiles". Задавая это
      # здесь, в настройках именно этого таргета, SPM-пакеты не затрагиваются.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 6KFX74C58U
          PROVISIONING_PROFILE_SPECIFIER: "Alfanomy App Store"
