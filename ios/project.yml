name: Alfanomy
options:
  bundleIdPrefix: ru.alfanomy
  deploymentTarget:
    iOS: "15.0"
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Alfanomy:
    type: application
    platform: iOS
    # Перечисляем Swift-файлы явно, а не всю папку Alfanomy с excludes:
    # ["Resources/**"] - при пересечении путей (sources исключает Resources/,
    # а resources отдельно ссылается на Alfanomy/Resources) XcodeGen молча
    # выбрасывал всю resources-запись Alfanomy/Resources из проекта целиком
    # (подтверждено печатью сгенерированного project.pbxproj в CI - там не
    # было вообще никакого упоминания Alfanomy/Resources). Явный список
    # исходников убирает это пересечение путей.
    sources:
      - path: Alfanomy/AppDelegate.swift
      - path: Alfanomy/PushToken.swift
      - path: Alfanomy/WebViewController.swift
    resources:
      # type: folder заставляет Xcode подключить это как единую "синюю папку"
      # (folder reference), сохраняющую структуру Resources/... внутри бандла
      # приложения. Без этого XcodeGen по умолчанию разворачивает содержимое
      # плоским списком файлов в корень бандла - тогда WebViewController.swift
      # не находит index.html через subdirectory: "Resources", и WebView
      # остаётся пустым (белый экран) навсегда.
      - path: Alfanomy/Resources
        type: folder
      - path: Alfanomy/Assets.xcassets
      - path: Alfanomy/GoogleService-Info.plist
    dependencies:
      - package: FirebaseSDK
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.alfanomy.mapp
        INFOPLIST_FILE: Alfanomy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      # Ручная подпись только для Release-конфигурации самого таргета Alfanomy.
      # Если задать это через xcodebuild -X на командной строке, оно применяется
      # ко ВСЕМ таргетам сборки разом, включая библиотеки Firebase/Google (SPM) -
      # а библиотеки в принципе не поддерживают provisioning profile, из-за чего
      # archive падал с "does not support provisioning profiles". Задавая это
      # здесь, в настройках именно этого таргета, SPM-пакеты не затрагиваются.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 6KFX74C58U
          PROVISIONING_PROFILE_SPECIFIER: "Alfanomy App Store"
