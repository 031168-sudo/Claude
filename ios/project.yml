name: Alfanomy
options:
  bundleIdPrefix: ru.alfanomy
  deploymentTarget:
    iOS: "15.0"
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Alfanomy:
    type: application
    platform: iOS
    sources:
      - path: Alfanomy
    resources:
      # Resources/ лежит РЯДОМ с Alfanomy (не внутри неё) специально: когда
      # она была вложена в Alfanomy (sources) и одновременно указана здесь
      # как resources-запись, XcodeGen вообще не добавлял её в проект - ни
      # как папку, ни развёрнутой плоским списком, вообще никак (проверено
      # печатью сгенерированного project.pbxproj в CI). Убрав пересечение
      # путей между sources и resources, проблема ушла. type: folder
      # сохраняет структуру Resources/... внутри бандла приложения - без
      # этого WebViewController.swift не находит index.html через
      # subdirectory: "Resources", и WebView остаётся пустым навсегда.
      - path: Resources
        type: folder
      - path: Alfanomy/Assets.xcassets
      - path: Alfanomy/GoogleService-Info.plist
    dependencies:
      - package: FirebaseSDK
        product: FirebaseMessaging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.alfanomy.mapp
        INFOPLIST_FILE: Alfanomy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      # Ручная подпись только для Release-конфигурации самого таргета Alfanomy.
      # Если задать это через xcodebuild -X на командной строке, оно применяется
      # ко ВСЕМ таргетам сборки разом, включая библиотеки Firebase/Google (SPM) -
      # а библиотеки в принципе не поддерживают provisioning profile, из-за чего
      # archive падал с "does not support provisioning profiles". Задавая это
      # здесь, в настройках именно этого таргета, SPM-пакеты не затрагиваются.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 6KFX74C58U
          PROVISIONING_PROFILE_SPECIFIER: "Alfanomy App Store"
