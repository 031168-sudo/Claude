name: Alfanomy
options:
  bundleIdPrefix: ru.alfanomy
  deploymentTarget:
    iOS: "15.0"
packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
targets:
  Alfanomy:
    type: application
    platform: iOS
    sources:
      - path: Alfanomy
    resources:
      - path: Alfanomy/Assets.xcassets
      - path: Alfanomy/GoogleService-Info.plist
    dependencies:
      - package: FirebaseSDK
        product: FirebaseMessaging
    # Веб-приложение (web/: index.html, code.js, картинки, вложенные папки)
    # копируется в бандл скриптом как папка web/ - её ищет
    # WebViewController.swift. Папку НЕЛЬЗЯ называть "Resources": это имя
    # зарезервировано структурой бандла, codesign на ней падает с "code
    # object is not signed at all", а декларативный type: folder с этим
    # именем молча выпадал из сборки.
    postBuildScripts:
      - name: Copy web app
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="$CODESIGNING_FOLDER_PATH/web"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRCROOT/web/." "$DEST/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.alfanomy.mapp
        INFOPLIST_FILE: Alfanomy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
      # Ручная подпись только для Release-конфигурации самого таргета Alfanomy.
      # Если задать это через xcodebuild -X на командной строке, оно применяется
      # ко ВСЕМ таргетам сборки разом, включая библиотеки Firebase/Google (SPM) -
      # а библиотеки в принципе не поддерживают provisioning profile, из-за чего
      # archive падал с "does not support provisioning profiles". Задавая это
      # здесь, в настройках именно этого таргета, SPM-пакеты не затрагиваются.
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          DEVELOPMENT_TEAM: 6KFX74C58U
          PROVISIONING_PROFILE_SPECIFIER: "Alfanomy App Store"
