plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

// versionName - "человеческая" версия для карточки в магазине, меняем её сами,
// когда хотим показать пользователю, что вышло заметное обновление (1.0 -> 1.1 -> 2.0).
// versionCode - то, что реально требует магазин: у каждой загруженной сборки он должен
// быть строго больше предыдущей. Чтобы про это не думать и не забывать бампать руками,
// CI сам передаёт сюда номер сборки GitHub Actions (appVersionCode); без него (например,
// при локальной сборке) используется 1, как и раньше.
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toInteger()

android { namespace 'ru.alfanomy.mapp'; compileSdk 35
    defaultConfig {
        applicationId 'ru.alfanomy.mapp'; minSdk 23; targetSdk 34
        versionCode appVersionCode
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    // AGP 8 больше не генерирует BuildConfig по умолчанию - а MainActivity
    // использует BuildConfig.DEBUG, чтобы не включать отладку WebView в релизе.
    buildFeatures { buildConfig true }
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Заполняется в CI из GitHub Actions secrets (см. .github/workflows/android.yml).
        // Сам keystore в репозиторий не кладём - только эти переменные окружения.
        release {
            storeFile file(System.getenv('RELEASE_KEYSTORE_PATH') ?: '../keystore/release.keystore')
            storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RELEASE_KEY_ALIAS')
            keyPassword System.getenv('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
}
