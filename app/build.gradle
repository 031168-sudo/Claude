plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

android { namespace 'ru.alfanomy.mapp'; compileSdk 35
    defaultConfig { applicationId 'ru.alfanomy.mapp'; minSdk 23; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        debug {
            storeFile file('../keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Заполняется в CI из GitHub Actions secrets (см. .github/workflows/android.yml).
        // Сам keystore в репозиторий не кладём - только эти переменные окружения.
        release {
            storeFile file(System.getenv('RELEASE_KEYSTORE_PATH') ?: '../keystore/release.keystore')
            storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
            keyAlias System.getenv('RELEASE_KEY_ALIAS')
            keyPassword System.getenv('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'androidx.core:core:1.13.1'
}
