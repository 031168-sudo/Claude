name: Build Android APK

on:
  push:
    branches: [ main, master, 'release/**' ]
    # Тег вида v2.0 - финальный релиз версии
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  # write - чтобы выложить APK в GitHub Releases
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 'secrets' нельзя использовать напрямую в 'if:' шага - только через
      # промежуточную переменную окружения уровня джобы.
      HAS_RELEASE_SECRET: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ставим Gradle напрямую, gradlew (wrapper) не требуется
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # packages: '' отключает установку экшеном по умолчанию пакета 'tools' -
      # Google убрал его из репозитория SDK, из-за чего шаг падает с exit code 1
      # ещё до того, как отработает следующий шаг с явным списком пакетов.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # github.run_number растёт на 1 при каждом запуске этого workflow - его и
      # используем как versionCode, чтобы номер сборки не нужно было бампать руками.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Боевая (release) сборка собирается, только если в репозитории заведены
      # секреты RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS /
      # RELEASE_KEY_PASSWORD (Settings -> Secrets and variables -> Actions).
      # Без них этот и следующий шаг просто пропускаются, debug-сборка не страдает.
      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SECRET == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Build release APK
        if: ${{ env.HAS_RELEASE_SECRET == 'true' }}
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }}

      - name: Upload release APK
        if: ${{ env.HAS_RELEASE_SECRET == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # GitHub Release со ссылкой на скачивание APK:
      # - ветка release/** - предварительная (pre-release) тестовая сборка;
      # - тег v* - финальный релиз версии.
      # В магазины (RuStore, App Store) отсюда ничего не загружается.
      - name: Prepare GitHub Release
        id: rel
        if: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" app/build.gradle)
          BUILD=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Версия $VERSION (сборка $BUILD)" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$VERSION-test-$BUILD" >> "$GITHUB_OUTPUT"
            echo "name=Версия $VERSION, тестовая сборка $BUILD" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/AlfaSputnik-$VERSION-$BUILD-debug.apk"
          if ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/release/*.apk "dist/AlfaSputnik-$VERSION-$BUILD-release.apk"
          fi
          ls -l dist

      - name: Publish GitHub Release
        if: ${{ steps.rel.outputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.rel.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
