name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Если в корне репозитория лежит zip-архив проекта (например mapp-project-fixed.zip),
      # он будет автоматически распакован сюда же. Если проект уже лежит распакованным
      # (есть папка app/), этот шаг просто ничего не сделает.
      - name: Unzip project archive (if present)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            echo "Найден архив: ${zips[0]}, распаковываю..."
            unzip -o "${zips[0]}" -d .
          else
            echo "Zip-архив не найден, использую файлы репозитория как есть."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ставим Gradle напрямую, gradlew (wrapper) не требуется
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlfaSputnik-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

