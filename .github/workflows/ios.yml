name: Build iOS App

on:
  push:
    branches: [ main, master, 'release/**' ]
    paths: [ 'ios/**', '.github/workflows/ios.yml', '.github/testflight-trigger.txt', '.github/scripts/**' ]
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Загрузить сборку в TestFlight'
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      # 'secrets' нельзя использовать напрямую в 'if:' шага - только через
      # промежуточную переменную окружения уровня джобы (см. android.yml).
      HAS_IOS_SIGNING: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # нужна предыдущая версия, чтобы понять, менялся ли .github/testflight-trigger.txt
          fetch-depth: 2

      # Загрузка в TestFlight - только по запросу: вручную (Run workflow с галочкой
      # "Загрузить сборку в TestFlight") или когда в пуше изменён .github/testflight-trigger.txt.
      # Обычные пуши, как и раньше, только собирают .ipa в артефакты.
      - name: Decide TestFlight upload
        run: |
          UPLOAD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.testflight }}" = "true" ]; then UPLOAD=true; fi
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qx '.github/testflight-trigger.txt'; then UPLOAD=true; fi
          echo "TESTFLIGHT=$UPLOAD" >> "$GITHUB_ENV"
          echo "Загрузка в TestFlight: $UPLOAD"

      # Раннер macos-15 держит рядом несколько версий Xcode в /Applications
      # (Xcode_16.x, Xcode_26.x и т.д.), а команда по умолчанию (xcode-select)
      # может указывать на устаревшую. Apple с осени 2025 требует, чтобы любая
      # сборка для App Store Connect была собрана iOS 26 SDK (Xcode 26+) -
      # выбираем самую новую версию, какая реально есть на раннере, вместо
      # того чтобы жёстко прописывать номер, который снова устареет.
      - name: Select latest available Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Собираем для симулятора всегда - подписи для этого не нужно, это
      # быстрая проверка, что проект вообще компилируется.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Alfanomy.xcodeproj \
            -scheme Alfanomy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Боевой подписанный .ipa собирается, только если в репозитории заведены
      # секреты IOS_DISTRIBUTION_P12_BASE64 / IOS_DISTRIBUTION_P12_PASSWORD /
      # IOS_PROVISIONING_PROFILE_BASE64 (Settings -> Secrets and variables -> Actions).
      # Без них следующие шаги просто пропускаются, симуляторная сборка не страдает.
      - name: Import signing certificate and provisioning profile
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          P12_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          # tr убирает любые случайные переносы строк/пробелы, которые могли
          # попасть в значение секрета при копировании длинной base64-строки
          # вручную через веб-форму GitHub - иначе base64 -d молча портит вывод
          # и security потом ругается "Unknown format in import".
          echo -n "$IOS_DISTRIBUTION_P12_BASE64" | tr -d '[:space:]' | base64 -d -o "$P12_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '[:space:]' | base64 -d -o "$PROFILE_PATH"
          echo "Decoded p12 size: $(wc -c < "$P12_PATH") bytes"
          echo "Decoded profile size: $(wc -c < "$PROFILE_PATH") bytes"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

      # Подпись (CODE_SIGN_STYLE/IDENTITY/PROVISIONING_PROFILE_SPECIFIER) задана
      # в project.yml для Release-конфигурации таргета Alfanomy, а не здесь -
      # см. комментарий в project.yml, почему это важно для SPM-пакетов.
      - name: Archive signed app
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          xcodebuild archive \
            -project Alfanomy.xcodeproj \
            -scheme Alfanomy \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Alfanomy.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      # Без web/index.html приложение на устройстве показывает только белый
      # экран, а сборка при этом проходит "успешно" - валим CI явно.
      - name: Verify web app is bundled
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          APP_PATH="$RUNNER_TEMP/Alfanomy.xcarchive/Products/Applications/Alfanomy.app"
          test -f "$APP_PATH/web/index.html" || { echo "web/index.html missing from app bundle"; ls -la "$APP_PATH"; exit 1; }
          echo "web/ bundled: $(find "$APP_PATH/web" -type f | wc -l) files"

      # Без aps-environment в подписи push на iPhone не приходят совсем,
      # а сборка при этом проходит "успешно" - валим CI явно.
      - name: Verify push entitlement is signed in
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          APP_PATH="$RUNNER_TEMP/Alfanomy.xcarchive/Products/Applications/Alfanomy.app"
          codesign -d --entitlements - "$APP_PATH" 2>/dev/null | tee /dev/stderr | grep -q "aps-environment" \
            || { echo "aps-environment entitlement missing from signed app"; exit 1; }

      - name: Export signed IPA
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Alfanomy.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload signed IPA
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Alfanomy-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      # ---------- Загрузка в TestFlight (по образцу DateBook / Palm-calendar) ----------
      # Нужны секреты ASC_KEY_ID (10 символов), ASC_ISSUER_ID (36 символов) и ASC_KEY_P8
      # (содержимое AuthKey_XXXX.p8) - ключ App Store Connect API той же команды Apple,
      # где лежит приложение ru.alfanomy.mapp (Team ID 6KFX74C58U).
      - name: Prepare App Store Connect API key
        if: ${{ env.TESTFLIGHT == 'true' }}
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          K: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ "$HAS_IOS_SIGNING" = "true" ] || { echo "::error::Нет секретов подписи iOS (IOS_DISTRIBUTION_P12_BASE64 и др.) - загружать нечего"; exit 1; }
          [ -n "$KID" ] || { echo "::error::Нет секрета ASC_KEY_ID"; exit 1; }
          [ -n "$ISS" ] || { echo "::error::Нет секрета ASC_ISSUER_ID"; exit 1; }
          [ -n "$K" ] || { echo "::error::Нет секрета ASC_KEY_P8"; exit 1; }
          KEY_ID=$(printf '%s' "$KID" | tr -d ' \r\n\t'); ISSUER_ID=$(printf '%s' "$ISS" | tr -d ' \r\n\t')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"; echo "ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"
          echo "::notice title=Секреты App Store Connect::длины: KeyID=${#KEY_ID} (нужно 10), Issuer=${#ISSUER_ID} (нужно 36)"
          mkdir -p ~/private_keys
          # приводим ключ к правильному виду, даже если при вставке пропали переводы строк
          BODY=$(printf '%s' "$K" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > ~/private_keys/AuthKey_$KEY_ID.p8
          pip3 install --quiet --break-system-packages pyjwt cryptography requests 2>/dev/null || pip3 install --quiet pyjwt cryptography requests

      - name: Upload to TestFlight (App Store Connect API)
        if: ${{ env.TESTFLIGHT == 'true' }}
        timeout-minutes: 20
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "ipa: $IPA"
          IPA="$IPA" BUILD="${{ github.run_number }}" python3 - <<'PY'
          import os, re, time, json, jwt, requests, sys
          kid = os.environ["KEY_ID"]; iss = os.environ["ISSUER_ID"]; ipa = os.environ["IPA"]; build = os.environ["BUILD"]
          key = open(os.path.expanduser(f"~/private_keys/AuthKey_{kid}.p8")).read()
          ver = re.search(r'MARKETING_VERSION: "([^"]+)"', open("project.yml").read()).group(1)
          def token():
              return jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 1100, "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": kid})
          base = "https://api.appstoreconnect.apple.com"
          def api(method, path, body=None):
              r = requests.request(method, base + path, timeout=120, headers={"Authorization": "Bearer " + token(), "Content-Type": "application/json"},
                                   data=json.dumps(body) if body is not None else None)
              if r.status_code >= 300:
                  print(f"::error title=Ошибка загрузки (API)::{method} {path} -> {r.status_code} {r.text[:500]}".replace("\n", " "))
                  sys.exit(1)
              return r.json() if r.text else {}
          apps = api("GET", "/v1/apps?filter[bundleId]=ru.alfanomy.mapp")["data"]
          if not apps:
              print("::error::App Store Connect не нашёл приложение ru.alfanomy.mapp: ключ не той команды Apple?"); sys.exit(1)
          app = apps[0]["id"]
          bu = api("POST", "/v1/buildUploads", {"data": {"type": "buildUploads", "attributes": {"cfBundleShortVersionString": ver, "cfBundleVersion": build, "platform": "IOS"},
                                                "relationships": {"app": {"data": {"type": "apps", "id": app}}}}})["data"]["id"]
          size = os.path.getsize(ipa)
          f = api("POST", "/v1/buildUploadFiles", {"data": {"type": "buildUploadFiles", "attributes": {"fileName": os.path.basename(ipa), "fileSize": size, "uti": "com.apple.ipa", "assetType": "ASSET"},
                                                   "relationships": {"buildUpload": {"data": {"type": "buildUploads", "id": bu}}}}})["data"]
          data = open(ipa, "rb").read()
          for op in f["attributes"]["uploadOperations"]:
              chunk = data[op["offset"]: op["offset"] + op["length"]]
              h = {x["name"]: x["value"] for x in op["requestHeaders"]}
              r = requests.request(op["method"], op["url"], headers=h, data=chunk, timeout=300)
              if r.status_code >= 300:
                  print(f"::error title=Ошибка загрузки файла::{r.status_code} {r.text[:300]}".replace("\n", " ")); sys.exit(1)
          api("PATCH", "/v1/buildUploadFiles/" + f["id"], {"data": {"type": "buildUploadFiles", "id": f["id"], "attributes": {"uploaded": True}}})
          print(f"::notice title=TestFlight::Файл {size} байт отправлен, сборка {ver} ({build}); ждём обработки у Apple")
          PY

      # Ждёт обработки (до 40 минут), включает уведомления, добавляет сборку во внешние группы
      # тестировщиков и отправляет на проверку Apple. Ошибки здесь - только предупреждение.
      - name: Distribute to external testers
        if: ${{ env.TESTFLIGHT == 'true' }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          ASC_VERSION=$(grep -oE 'MARKETING_VERSION: "[^"]+"' project.yml | grep -oE '[0-9][0-9.]*') \
          ASC_BUILD=${{ github.run_number }} python3 ../.github/scripts/asc_distribute.py

