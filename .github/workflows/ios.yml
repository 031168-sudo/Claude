name: Build iOS App

on:
  push:
    branches: [ main, master ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Пока собираем только для симулятора - подписи ещё нет, а для
      # симулятора она не нужна. Реальный подписанный билд для iPhone/TestFlight
      # добавим отдельным шагом, когда будут готовы сертификат и профиль
      # из Apple Developer.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Alfanomy.xcodeproj \
            -scheme Alfanomy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
