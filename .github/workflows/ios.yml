name: Build iOS App

on:
  push:
    branches: [ main, master ]
    paths: [ 'ios/**', '.github/workflows/ios.yml' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      # 'secrets' нельзя использовать напрямую в 'if:' шага - только через
      # промежуточную переменную окружения уровня джобы (см. android.yml).
      HAS_IOS_SIGNING: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Собираем для симулятора всегда - подписи для этого не нужно, это
      # быстрая проверка, что проект вообще компилируется.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Alfanomy.xcodeproj \
            -scheme Alfanomy \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      # Боевой подписанный .ipa собирается, только если в репозитории заведены
      # секреты IOS_DISTRIBUTION_P12_BASE64 / IOS_DISTRIBUTION_P12_PASSWORD /
      # IOS_PROVISIONING_PROFILE_BASE64 (Settings -> Secrets and variables -> Actions).
      # Без них следующие шаги просто пропускаются, симуляторная сборка не страдает.
      - name: Import signing certificate and provisioning profile
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          P12_PATH=$RUNNER_TEMP/distribution.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$IOS_DISTRIBUTION_P12_BASE64" | base64 -d -o "$P12_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"

      - name: Archive signed app
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          xcodebuild archive \
            -project Alfanomy.xcodeproj \
            -scheme Alfanomy \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Alfanomy.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=6KFX74C58U \
            PROVISIONING_PROFILE_SPECIFIER="Alfanomy App Store" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export signed IPA
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Alfanomy.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload signed IPA
        if: ${{ env.HAS_IOS_SIGNING == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: Alfanomy-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
